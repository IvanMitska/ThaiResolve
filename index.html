<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon-192.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload hero scene image so it's available before the JS scene mounts. -->
    <link
      rel="preload"
      as="image"
      href="/scene/hand@2x.webp"
      imagesrcset="/scene/hand@1x.webp 1x, /scene/hand@2x.webp 2x"
      fetchpriority="high"
    />

    <!-- SEO Meta Tags -->
    <title>ThaiResolve — Помощь в Таиланде | Мошенничество, юридические вопросы</title>
    <meta name="description" content="Профессиональная помощь в Таиланде при мошенничестве, арендных спорах, ДТП. Партнёрская сеть юристов и консультантов. Ответ в течение 1 часа." />
    <meta name="keywords" content="помощь в Таиланде, мошенничество Таиланд, юрист Таиланд, адвокат Пхукет, ДТП Таиланд, аренда Таиланд" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thairesolve.com/" />
    <meta property="og:title" content="ThaiResolve — Помощь в Таиланде" />
    <meta property="og:description" content="Профессиональная помощь при мошенничестве, юридических и бытовых проблемах в Таиланде." />
    <meta property="og:image" content="https://thairesolve.com/og-image.jpg" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThaiResolve — Помощь в Таиланде" />
    <meta name="twitter:description" content="Профессиональная помощь при мошенничестве, юридических и бытовых проблемах в Таиланде." />
    <meta name="twitter:image" content="https://thairesolve.com/og-image.jpg" />

    <!-- Canonical & Alternate -->
    <link rel="canonical" href="https://thairesolve.com/" />
    <link rel="alternate" hreflang="ru" href="https://thairesolve.com/" />
    <link rel="alternate" hreflang="en" href="https://thairesolve.com/?lang=en" />

    <!-- DNS Prefetch & Preconnect for critical resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical assets -->
    <link rel="preload" as="font" href="https://fonts.gstatic.com/s/montserrat/v26/JTUHjIg1_i6t8kCHKm4532VJOt5-QNFgpCuM70w5aXp-p7K4KLg.woff2" type="font/woff2" crossorigin />

    <!-- Theme color -->
    <meta name="theme-color" content="#FAFAFA" />

    <!-- Critical CSS inline for faster FCP -->
    <style>
      /* Critical path CSS */
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;background:#F7F8F7;overflow-x:hidden}
      #root{min-height:100vh}
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ThaiResolve",
      "description": "Профессиональная помощь в Таиланде при мошенничестве, юридических и бытовых проблемах",
      "url": "https://thairesolve.com",
      "logo": "https://thairesolve.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["Russian", "English"]
      },
      "areaServed": {
        "@type": "Country",
        "name": "Thailand"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
